task: evaluation
run_id: doc-multiturn-char-no-dist
provider: together
model: phdigiacomo-b8fe/my-endpoint1
endpoint_env: TOGETHER_ENDPOINT_LLAMA_3_1_8B_INSTRUCT
max_tokens: 4096
evaluations_dir: data/evaluations

aws_region: us-west-2
dynamodb_endpoint_url: http://localhost:8000
outcomes_table: outcomes
articles_table: articles

# Subset controls.
# Start at this CSR ID in CSR index order.
starting_review: CSR_0306
# Evaluate at most this many outcome questions after applying starting_review.
max_questions: 1
# Optionally uncomment to limit the number of CSR IDs considered.
# review_count: 10

# DOC + DET + no DIST.
# For multiturn_char, each context is one included-study document and no distractors
# are added. Accuracy is computed against the repository's maybe target, m.
detail_exposure_types:
  - multiturn_char
irrelevant_docs_per_context: 0
maximum_follow_ups: 4
gatekeeper_type: free_response
